<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guul!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Checkmark animation */
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #34c759;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(52, 199, 89, 0.3);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .checkmark svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #fff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 15px;
      color: #6c6c70;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .user-card {
      background: #f8f8fc;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
      border: 1px solid #e8e8f0;
    }
    .user-card .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 15px;
    }
    .user-card .row .label {
      color: #8e8e93;
      font-weight: 400;
    }
    .user-card .row .value {
      color: #1c1c1e;
      font-weight: 600;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: #007AFF;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .btn:hover {
      background: #0055cc;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 122, 255, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }

    .version-footer {
      margin-top: 24px;
      font-size: 12px;
      color: #8e8e93;
      letter-spacing: 0.2px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 20px 24px;
      }
      .title {
        font-size: 24px;
      }
      .checkmark {
        width: 72px;
        height: 72px;
      }
      .checkmark svg {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Animated checkmark -->
  <div class="checkmark">
    <svg viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  </div>

  <div class="title">Guul!</div>
  <div class="subtitle">Deeqdaada waa la ansixiyay.<br />Waxaad hadda heli kartaa lacagtaada.</div>

  <!-- User details (from localStorage) -->
  <div class="user-card" id="userCard">
    <div class="row">
      <span class="label">Magaca</span>
      <span class="value" id="displayName">—</span>
    </div>
    <div class="row">
      <span class="label">Lambarka</span>
      <span class="value" id="displayPhone">—</span>
    </div>
    <div class="row">
      <span class="label">Xaaladda</span>
      <span class="value" style="color:#34c759;">✅ La ansixiyay</span>
    </div>
  </div>

  <!-- Continue button -->
  <button class="btn" id="continueBtn">Sii wad</button>

  <div class="version-footer">Version 12.4.0892 (1200040892)</div>
</div>

<script>
  (function() {
    // Retrieve user data from localStorage
    const name = localStorage.getItem('fullName') || localStorage.getItem('name') || 'Adeegsade';
    const phone = localStorage.getItem('phone') || '—';

    document.getElementById('displayName').textContent = name;
    document.getElementById('displayPhone').textContent = phone;

    // Handle continue button – redirect to loan calculator (or any page you prefer)
    document.getElementById('continueBtn').addEventListener('click', function() {
      // You can change this URL to wherever you want users to go after success
      window.location.href = 'loan.html';
    });
  })();
</script>

</body>
</html>
