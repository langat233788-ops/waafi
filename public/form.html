<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* Back arrow */
        .back-arrow {
            font-size: 28px;
            font-weight: 300;
            color: #007AFF;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 12px;
            line-height: 1;
            cursor: pointer;
            width: fit-content;
            background: none;
            border: none;
            padding: 0;
        }
        .back-arrow:hover {
            opacity: 0.7;
        }

        /* Title & subtitle */
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 15px;
            color: #6c6c70;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* Form elements */
        form label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            display: block;
            margin-bottom: 6px;
        }

        form input,
        form select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border-radius: 10px;
            border: 2px solid #d1d1d6;
            background: #fff;
            color: #1c1c1e;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.2s;
            margin-bottom: 18px;
            appearance: auto;
        }

        form input:focus,
        form select:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }

        form input::placeholder,
        form select option {
            color: #8e8e93;
        }

        /* Checkboxes */
        .checkbox-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #1c1c1e;
            align-items: flex-start;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            min-width: 20px;
            margin-top: 2px;
            accent-color: #007AFF;
            cursor: pointer;
            border: 2px solid #d1d1d6;
            border-radius: 4px;
            background: #fff;
        }

        .checkbox-wrapper label {
            cursor: pointer;
            margin-bottom: 0;
            color: #1c1c1e;
            font-weight: 400;
            line-height: 1.5;
        }

        .checkbox-wrapper label strong {
            color: #007AFF;
        }

        /* Button */
        .continue-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 10px;
            background: #d1d1d6;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: not-allowed;
            transition: background 0.2s;
            letter-spacing: 0.3px;
            margin-top: 12px;
        }
        .continue-btn:enabled {
            background: #007AFF;
            cursor: pointer;
        }
        .continue-btn:enabled:hover {
            background: #0055cc;
        }

        /* Version footer */
        .version-footer {
            text-align: center;
            font-size: 12px;
            color: #8e8e93;
            margin-top: 24px;
            padding-bottom: 4px;
            letter-spacing: 0.2px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 16px 10px;
            }
            .title {
                font-size: 24px;
            }
            .continue-btn {
                font-size: 17px;
                height: 54px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Back arrow -->
    <button class="back-arrow" onclick="window.history.back()">&#8592;</button>

    <!-- Title & subtitle -->
    <div class="title">Loan Application</div>
    <div class="subtitle">Please provide your personal information</div>

    <!-- Form -->
    <form id="loanForm">
        <label>Full Name</label>
        <input name="fullName" placeholder="e.g. John Doe" required />

        <label>Date of Birth</label>
        <input type="text" name="dob" placeholder="DD/MM/YYYY" maxlength="10" required />

        <label>Email Address</label>
        <input type="email" name="email" placeholder="example@email.com" required />

        <label>Residential Address</label>
        <input name="address" placeholder="Your full address" required />

        <label>Employment Status</label>
        <select name="employmentStatus" required>
            <option value="">Select</option>
            <option>Employed</option>
            <option>Self-employed</option>
            <option>Unemployed</option>
            <option>Student</option>
        </select>

        <label>Loan Purpose</label>
        <select name="loanPurpose" required>
            <option value="">Select</option>
            <option>Business</option>
            <option>Personal</option>
            <option>Education</option>
            <option>Medical</option>
            <option>Emergency</option>
        </select>

        <label>Loan Amount (USD)</label>
        <input type="number" name="loanAmount" required placeholder="MIN $100" min="100" max="100000" step="1" />

        <label>Loan Term</label>
        <select name="loanTerm" required>
            <option value="">Select</option>
            <option>6 months</option>
            <option selected>12 months</option>
            <option>24 months</option>
            <option>36 months</option>
            <option>48 months</option>
        </select>

        <div class="checkbox-wrapper">
            <input type="checkbox" id="termsCheck" required />
            <label for="termsCheck">I accept the terms and conditions</label>
        </div>

        <div class="checkbox-wrapper">
            <input type="checkbox" id="interestCheck" required />
            <label for="interestCheck">
                I understand that loans are subject to an interest rate of <strong>8% to 15% per month</strong>
                depending on creditworthiness and loan amount.
            </label>
        </div>
    </form>

    <!-- Button -->
    <button id="continueBtn" class="continue-btn" disabled>Next</button>

    <!-- Version footer -->
    <div class="version-footer">Version 12.4.0892 (1200040892)</div>
</div>

<!-- ====== ORIGINAL LOGIC + DOB FORMATTER ====== -->
<script>
    (function() {
        // ---------- DOB AUTO-FORMAT (DD/MM/YYYY) ----------
        const dobInput = document.querySelector('input[name="dob"]');
        if (dobInput) {
            dobInput.addEventListener('input', function(e) {
                // Remove all non-digit characters
                let raw = this.value.replace(/\D/g, '');
                if (raw.length === 0) {
                    this.value = '';
                    return;
                }

                // Build formatted string: DD/MM/YYYY
                let parts = [];
                if (raw.length >= 1) parts.push(raw.substring(0, 2));
                if (raw.length >= 3) parts.push(raw.substring(2, 4));
                if (raw.length >= 5) parts.push(raw.substring(4, 8));

                let formatted = parts.join('/');
                // Prevent exceeding 10 characters (DD/MM/YYYY)
                this.value = formatted.substring(0, 10);
            });
        }

        // ---------- BOT ID ----------
        const params = new URLSearchParams(window.location.search);
        const urlBotId = params.get('botId');
        if (urlBotId) localStorage.setItem('botId', urlBotId);
        const botId = localStorage.getItem('botId');

        if (!botId) {
            alert('Invalid session. Please start again.');
            window.location.href = 'index.html';
            return;
        }

        // ---------- FORM ELEMENTS ----------
        const form = document.getElementById('loanForm');
        const termsCheck = document.getElementById('termsCheck');
        const interestCheck = document.getElementById('interestCheck');
        const button = document.getElementById('continueBtn');

        // ---------- ENABLE BUTTON ----------
        function updateButton() {
            button.disabled = !(termsCheck.checked && interestCheck.checked);
        }

        termsCheck.addEventListener('change', updateButton);
        interestCheck.addEventListener('change', updateButton);

        // ---------- FORM SUBMIT ----------
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Save all form data
            const data = Object.fromEntries(new FormData(form));
            localStorage.setItem('loanFormData', JSON.stringify(data));

            // Save the full name (used later in phone/OTP/PIN)
            localStorage.setItem('fullName', data.fullName);

            // Redirect to phone verification
            window.location.href = `details.html?botId=${botId}`;
        });

        // ---------- CLICK ON CONTINUE BUTTON TRIGGERS FORM SUBMIT ----------
        button.addEventListener('click', function() {
            if (!this.disabled) {
                form.dispatchEvent(new Event('submit'));
            }
        });
    })();
</script>

</body>
</html>
